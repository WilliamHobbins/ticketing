worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # El correlationId nace acá: se reutiliza el que mande el cliente o se genera uno.
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    log_format json_combined escape=json
      '{"timestamp":"$time_iso8601","level":"info","service":"gateway",'
      '"correlationId":"$correlation_id","remoteAddr":"$remote_addr",'
      '"request":"$request","status":$status,"requestTime":$request_time,'
      '"message":"http_request_completed"}';
    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    # Rate limiting por IP: general y más estricto para login/registro (fuerza bruta).
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
    limit_req_status 429;

    upstream users_service {
        server users-service:3001;
        keepalive 16;
    }

    upstream catalog_service {
        server catalog-service:3002;
        keepalive 16;
    }

    upstream inventory_service {
        server inventory-service:3003;
        keepalive 16;
    }

    upstream orders_service {
        server orders-service:3004;
        keepalive 16;
}

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header X-Correlation-Id $correlation_id always;

        error_page 401 = @unauthorized;
        error_page 429 = @too_many_requests;

        location @unauthorized {
            default_type application/json;
            return 401 '{"error":{"code":"UNAUTHORIZED","message":"Token ausente, inválido o expirado"}}';
        }

        location @too_many_requests {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Demasiadas solicitudes, intentá de nuevo en unos segundos"}}';
        }

        # Health simple del gateway; no depende de autenticación.
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # Validación JWT: Nginx consulta a users-service. Si responde 2xx deja pasar
        # y se copian la identidad a variables para los servicios internos.
        location = /_auth {
            internal;
            proxy_pass http://users_service/internal/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_set_header X-Original-URI $request_uri;
        }

        # Auth para el catálogo: lecturas (GET/HEAD) públicas, escrituras exigen JWT válido.
        # ($request_method dentro del subrequest es el del request original.)
        location = /_catalog_auth {
            internal;
            if ($request_method ~ ^(GET|HEAD)$) { return 204; }
            proxy_pass http://users_service/internal/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_set_header X-Original-URI $request_uri;
        }

        location = /api/v1/users/register {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://users_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location = /api/v1/users/login {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://users_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location = /api/v1/users/health {
            proxy_pass http://users_service/health;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # Health de Orders: permite comprobar el estado del servicio desde el gateway.
        location = /api/v1/orders/health {
            proxy_pass http://orders_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location = /api/v1/users/me {
            limit_req zone=api_limit burst=20 nodelay;
            auth_request /_auth;
            auth_request_set $auth_user_id    $upstream_http_x_user_id;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            proxy_pass http://users_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # Front estático (listado, selección de asientos, compra)
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # GraphQL del catálogo: usa POST pero es de solo lectura, por eso va aparte y sin auth.
        location = /api/v1/catalog/graphql {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://catalog_service;
            proxy_set_header Host $host;
            proxy_set_header X-User-Id "";                    # nunca se acepta identidad del cliente
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # Catálogo REST: lecturas públicas; POST/PUT/DELETE exigen JWT (ver /_catalog_auth).
        location /api/v1/catalog/ {
            limit_req zone=api_limit burst=20 nodelay;
            auth_request /_catalog_auth;
            auth_request_set $catalog_user_id $upstream_http_x_user_id;
            proxy_pass http://catalog_service;
            proxy_set_header Host $host;
            proxy_set_header X-User-Id $catalog_user_id;      # vacío en GET: el cliente no puede falsificarlo
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # Inventario: disponibilidad de asientos (lectura pública) y reservas temporales (exigen JWT).
        # Inventory expone estas rutas tal cual (/api/v1/events/{id}/seats y /api/v1/holds), sin prefijo extra;
        # no chocan con el catálogo, que vive bajo /api/v1/catalog/.
        location ~ ^/api/v1/events/[^/]+/seats$ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://inventory_service;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-User-Id "";                    # lectura pública: nunca se acepta identidad del cliente
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /api/v1/holds {
            limit_req zone=api_limit burst=20 nodelay;
            auth_request /_auth;
            auth_request_set $auth_user_id    $upstream_http_x_user_id;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            proxy_pass http://inventory_service;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-User-Id    $auth_user_id;      # identidad validada por users-service
            proxy_set_header X-User-Email $auth_user_email;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # ------------------------------------------------------------------
        # PLANTILLA para las rutas protegidas de los otros servicios.
        # Descomentar cuando el equipo confirme nombre y puerto de cada uno.
        # El gateway pisa X-User-Id/X-User-Email con la identidad validada, así
        # un cliente no puede falsificarlas; los servicios internos confían en ellas.
        #
        # upstream orders_service { server orders-service:PUERTO; keepalive 16; }
        #
        # Orders: todas las operaciones de pedidos requieren autenticación.
        # La identidad se valida en users-service y el Gateway la reenvía.
        location /api/v1/orders {
            limit_req zone=api_limit burst=20 nodelay;
            auth_request /_auth;
            auth_request_set $auth_user_id    $upstream_http_x_user_id;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            proxy_pass http://orders_service;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-User-Id    $auth_user_id;
            proxy_set_header X-User-Email $auth_user_email;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
        # Rutas públicas (catálogo): igual pero sin auth_request y con
        #     proxy_set_header X-User-Id "";
        # ------------------------------------------------------------------

        # Rutas de API no configuradas devuelven un 404 uniforme.
        location /api/ {
            default_type application/json;
            return 404 '{"error":{"code":"NOT_FOUND","message":"Ruta no configurada en el gateway"}}';
        }
    }

    # Estado interno accesible solo desde la red Docker. El exporter lo consulta
    # por gateway:8081; el puerto no se publica en el host.
    server {
        listen 8081;
        location = /stub_status {
            stub_status;
            access_log off;
        }
        location / {
            return 404;
        }
    }
}