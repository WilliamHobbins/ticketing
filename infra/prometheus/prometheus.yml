global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "users-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["users-service:3001"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Agregar bajo `scrape_configs:` de infra/prometheus/prometheus.yml
  - job_name: catalog-service
    metrics_path: /metrics
    static_configs:
      - targets: [ "catalog-service:3002" ]

  - job_name: "inventory-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["inventory-service:8083"]

  - job_name: "orders-service"
    metrics_path: /metrics
    static_configs:
       - targets: ["orders-service:3004"]
    
  - job_name: "notifier-worker"
    metrics_path: /metrics
    static_configs:
        - targets: ["notifier-worker:3005"]