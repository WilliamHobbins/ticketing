openapi: 3.0.3
info:
  title: Users Service (vía API Gateway)
  version: 1.0.0
  description: |
    Registro, login y datos del usuario autenticado. Autenticación con JWT HS256 (`Authorization: Bearer <token>`).
    El gateway valida el token en las rutas protegidas y reenvía a los servicios internos las cabeceras
    `X-User-Id` y `X-User-Email` (identidad ya verificada) y `X-Correlation-Id`.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/users/register:
    post:
      summary: Registrar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Usuario creado, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/users/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Login correcto, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/users/me:
    get:
      summary: Usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Identidad del token
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/users/health:
    get:
      summary: Estado del servicio y su dependencia (PostgreSQL)
      responses:
        '200': { description: OK }
        '503': { description: Postgres no disponible }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: Error con formato uniforme del equipo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 72 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: string, example: 1h }
        user: { $ref: '#/components/schemas/User' }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
