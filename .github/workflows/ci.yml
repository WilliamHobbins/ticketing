name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  users-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: users-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: users-service/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
